<script>
var ROOM_NAME = 'Tzviya';
var API_URL = 'https://script.google.com/macros/s/AKfycbx0HmXiBpQtJPm4CUuxVrmIWXKJCmA7zzJkq2tWCPvP2n439v5MobUPEQxorBDb4XR1Xw/exec';
var availData = [], checkin = null, checkout = null, curYear, curMonth;
var maxGuests = 2, surcharge = {}, guestCount = 2;

function loadCal() {
  fetch(API_URL + '?room=' + encodeURIComponent(ROOM_NAME))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      maxGuests = data.maxGuests || 2;
      surcharge = data.surcharge || {};
      availData = data.dates || [];
      var now = new Date();
      curYear = now.getFullYear(); curMonth = now.getMonth();
      renderCal();
    })
    .catch(function() {
      document.getElementById('cal-wrap').innerHTML = '<div class="cal-loading">Unable to load. <a href="/contact.html">Contact us</a>.</div>';
    });
}

function getState(ds) {
  var today = new Date(); today.setHours(0,0,0,0);
  var dt = new Date(ds); dt.setHours(0,0,0,0);
  if (dt < today) return 'past';
  var info = availData.find(function(d) { return d.date === ds; });
  if (!info) return 'no-data';
  if (info.blocked) return 'blocked';
  if (dt.getDay() === 6) return 'checkout-only'; // Saturday
  return 'available';
}

function hasBlockedBetween(start, end) {
  var d = new Date(start);
  d.setDate(d.getDate() + 1);
  while (d < new Date(end)) {
    var ds = fmtKey(d);
    var s = getState(ds);
    if (s === 'blocked' || s === 'no-data') return true;
    d.setDate(d.getDate() + 1);
  }
  return false;
}

function fmtKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function fmtDisplay(ds) {
  var p = ds.split('-'); return p[2]+'/'+p[1]+'/'+p[0];
}

function renderCal() {
  var months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var dow=['Su','Mo','Tu','We','Th','Fr','Sa'];
  var first=new Date(curYear,curMonth,1).getDay(), total=new Date(curYear,curMonth+1,0).getDate();
  var today=new Date(); today.setHours(0,0,0,0);

  var h='<div class="cal-nav"><button onclick="prevM()">&#8592;</button><span>'+months[curMonth]+' '+curYear+'</span><button onclick="nextM()">&#8594;</button></div><div class="cal-grid">';
  dow.forEach(function(d){h+='<div class="cal-dow">'+d+'</div>';});
  for(var i=0;i<first;i++) h+='<div class="cal-day empty"></div>';

  for(var d=1;d<=total;d++){
    var ds=curYear+'-'+String(curMonth+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var state=getState(ds);
    var info=availData.find(function(x){return x.date===ds;});
    var cls='cal-day', priceH='';

    if(state==='past'||state==='no-data') { cls+=' past'; }
    else if(state==='blocked') { cls+=' blocked'; }
    else if(state==='checkout-only') {
      cls+=' blocked';
      if(checkin&&!checkout) cls+=' available'; // selectable as checkout
    }
    else { cls+=' available'; }

    if(info&&info.price&&state!=='past'&&state!=='blocked')
      priceH='<span class="cal-price">&#8362;'+info.price+'</span>';

    if(checkin&&checkout&&(ds===checkin||ds===checkout)) cls+=' selected';
    else if(checkin&&checkout&&ds>checkin&&ds<checkout) cls+=' in-range';
    else if(checkin&&!checkout&&ds===checkin) cls+=' selected';

    var clickable = (state==='available') || (state==='checkout-only'&&checkin&&!checkout);
    h+='<div class="'+cls+'"'+(clickable?' onclick="pick(\''+ds+\'\')"':'')+'>'+d+priceH+'</div>';
  }

  h+='</div>';

  // Guest selector
  if(maxGuests > 2) {
    h+='<div style="margin-top:1rem;display:flex;align-items:center;gap:0.75rem;font-family:var(--sans);font-size:0.82rem;color:var(--text)">';
    h+='<label style="font-weight:500">Guests:</label><select id="guest-sel" onchange="guestCount=parseInt(this.value);renderCal()" style="padding:4px 8px;border:1px solid var(--border);font-size:0.82rem;">';
    for(var g=1;g<=maxGuests;g++){
      var lbl = g===3?'3 (+25%)':g===4?'4 (+50%)':''+g;
      h+='<option value="'+g+'"'+(g===guestCount?' selected':'')+'>'+lbl+'</option>';
    }
    h+='</select></div>';
  }

  // Price breakdown
  if(checkin&&checkout){
    var nights=Math.round((new Date(checkout)-new Date(checkin))/86400000);
    var total=0;
    var d2=new Date(checkin);
    while(d2<new Date(checkout)){
      var inf=availData.find(function(x){return x.date===fmtKey(d2);});
      if(inf) total+=inf.price;
      d2.setDate(d2.getDate()+1);
    }
    var surchargePct=surcharge[guestCount]||0;
    var adjusted=Math.round(total*(1+surchargePct));
    var vat=Math.round(adjusted*0.18);
    var inclVAT=adjusted+vat;
    h+='<div style="margin-top:1rem;padding:0.85rem;background:var(--bg-warm);border:1px solid var(--border);font-family:var(--sans);font-size:0.78rem;color:var(--text-mid);line-height:1.9">';
    h+='<div>'+nights+' night'+(nights>1?'s':'')+'</div>';
    h+='<div style="display:flex;justify-content:space-between"><span>Total before VAT</span><span>&#8362;'+adjusted.toLocaleString()+'</span></div>';
    h+='<div style="display:flex;justify-content:space-between"><span>VAT (18%)</span><span>&#8362;'+vat.toLocaleString()+'</span></div>';
    h+='<div style="display:flex;justify-content:space-between;font-weight:600;border-top:1px solid var(--border);margin-top:4px;padding-top:4px"><span>Total incl. VAT</span><span>&#8362;'+inclVAT.toLocaleString()+'</span></div>';
    h+='<div style="margin-top:6px;font-size:0.7rem;color:var(--text-light)">Foreign tourists with a valid passport and B2 visa are exempt from VAT. Please mention this when submitting your booking request.</div>';
    h+='</div>';
  }

  h+='<div class="cal-legend"><span class="leg"><span class="leg-dot" style="background:#fff;border:1px solid #ddd"></span>Available</span><span class="leg"><span class="leg-dot" style="background:#f5f0ee;border:1px solid #ddd"></span>Unavailable / Check-out only</span><span class="leg"><span class="leg-dot" style="background:var(--gold)"></span>Selected</span></div>';

  document.getElementById('cal-wrap').innerHTML=h;
  updateSummary();
}

function pick(ds){
  var state=getState(ds);
  if(!checkin||(checkin&&checkout)){
    if(state!=='available') return;
    checkin=ds; checkout=null;
  } else {
    if(ds<=checkin){
      checkin=state==='available'?ds:null; checkout=null;
    } else {
      if(hasBlockedBetween(checkin,ds)){
        checkin=null; checkout=null;
        alert('Your selected range includes unavailable dates. Please choose different dates.');
      } else {
        checkout=ds;
      }
    }
  }
  renderCal();
}

function updateSummary(){
  var s=document.getElementById('sel-summary'),b=document.getElementById('book-btn');
  if(checkin&&checkout){
    var n=Math.round((new Date(checkout)-new Date(checkin))/86400000);
    s.innerHTML='<strong>'+fmtDisplay(checkin)+' &rarr; '+fmtDisplay(checkout)+'</strong> &nbsp;&middot;&nbsp; '+n+' night'+(n>1?'s':'');
    s.classList.add('show');
    b.href='/booking.html?room='+encodeURIComponent(ROOM_NAME)+'&checkin='+checkin+'&checkout='+checkout+'&guests='+guestCount;
    b.textContent='Book Tzviya \u2014 '+n+' night'+(n>1?'s':'');
  } else if(checkin){
    s.innerHTML='Select a check-out date'; s.classList.add('show');
    b.href='/booking.html'; b.textContent='Select check-out date';
  } else {
    s.classList.remove('show'); b.href='/booking.html'; b.textContent='Select dates to book';
  }
}

function prevM(){curMonth--;if(curMonth<0){curMonth=11;curYear--;}renderCal();}
function nextM(){curMonth++;if(curMonth>11){curMonth=0;curYear++;}renderCal();}
loadCal();
</script>
