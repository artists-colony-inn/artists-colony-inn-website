  <style>
    .thankyou-section {
      min-height: 60vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
      text-align: center;
    }
    .thankyou-inner { max-width: 560px; margin: 0 auto; }
    .thankyou-icon {
      font-size: 3rem;
      margin-bottom: 1.5rem;
      display: block;
    }
    .thankyou-inner h1 {
      font-family: var(--serif);
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      font-weight: 400;
      color: var(--text);
      margin-bottom: 1rem;
    }
    .thankyou-inner p {
      font-family: var(--sans);
      font-size: 0.95rem;
      color: var(--text-mid);
      line-height: 1.9;
      margin-bottom: 1rem;
    }
    .bit-note {
      background: var(--bg-warm);
      border: 1px solid var(--gold);
      border-radius: 6px;
      padding: 1rem 1.25rem;
      font-family: var(--sans);
      font-size: 0.88rem;
      color: var(--text-mid);
      line-height: 1.8;
      margin: 1.5rem 0;
      display: none;
    }

      width: 40px;
      height: 2px;
      background: var(--gold);
      margin: 1.5rem auto;
    }

        <strong dir="ltr">+972-58-620-0779</strong> בוואטסאפ כדי לאשר את ההזמנה.
