<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ביקורות אורחים | מלון בוטיק קריית האמנים</title>
  <meta name="description" content="קראו מה אורחים אומרים על שהותם במלון בוטיק קריית האמנים בצפת.">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .reviews-hero {
      text-align: center;
      padding: 3rem 0 2rem;
    }
    .google-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.85rem 1.5rem;
      margin: 1.5rem auto 0;
      box-shadow: var(--shadow);
    }
    .google-badge-logo {
      font-family: var(--sans);
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .google-badge-logo span:nth-child(1) { color: #4285F4; }
    .google-badge-logo span:nth-child(2) { color: #EA4335; }
    .google-badge-logo span:nth-child(3) { color: #FBBC05; }
    .google-badge-logo span:nth-child(4) { color: #4285F4; }
    .google-badge-logo span:nth-child(5) { color: #34A853; }
    .google-badge-logo span:nth-child(6) { color: #EA4335; }
    .google-badge-divider {
      width: 1px;
      height: 28px;
      background: var(--border);
    }
    .google-badge-score {
      font-family: var(--sans);
      font-size: 1.5rem;
      font-weight: 300;
      color: var(--text);
      line-height: 1;
    }
    .google-badge-stars {
      color: #FBBC05;
      font-size: 1rem;
      letter-spacing: 0.05em;
    }
    .google-badge-count {
      font-family: var(--sans);
      font-size: 0.78rem;
      color: var(--text-light);
      letter-spacing: 0.05em;
    }

    .review-card {
      background: var(--bg-warm);
      border: 1px solid var(--border);
      border-right: 3px solid var(--gold);
      padding: 1.4rem 1.6rem;
      margin-bottom: 1.25rem;
      transition: box-shadow 0.2s;
    }
    .review-card:hover { box-shadow: 0 2px 12px rgba(160,124,16,0.10); }

    .review-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.25rem;
      margin-bottom: 0.6rem;
    }
    .review-name {
      font-family: var(--sans);
      font-weight: 500;
      font-size: 0.95rem;
      color: var(--text);
    }
    .review-date {
      font-size: 0.82rem;
      color: var(--text-light);
      font-style: italic;
    }
    .review-stars {
      color: #FBBC05;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
    }
    .review-text {
      font-size: 0.95rem;
      color: var(--text-mid);
      line-height: 1.75;
      font-weight: 300;
    }
    .review-text.rtl {
      direction: rtl;
      text-align: right;
    }
    .review-text.collapsed {
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .review-read-more {
      background: none;
      border: none;
      color: var(--gold);
      font-family: var(--sans);
      font-size: 0.82rem;
      cursor: pointer;
      padding: 0.3rem 0;
      letter-spacing: 0.05em;
      display: none;
    }
    .review-read-more:hover { color: var(--gold-light); }

    .reviews-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      margin-top: 2.5rem;
    }

    .show-more-wrap {
      text-align: center;
      margin: 2rem 0;
    }

    .reviews-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 3rem 0;
    }

    .form-intro {
      font-size: 1rem;
      color: var(--text-light);
      margin-bottom: 1.5rem;
      font-style: italic;
      text-align: center;
    }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label {
      display: block;
      font-size: 0.68rem;
      font-weight: 300;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-light);
      margin-bottom: 4px;
    }
    .form-group input[type="text"],
    .form-group textarea {
      width: 100%;
      font-family: var(--sans);
      font-size: 0.95rem;
      background: var(--white);
      border: 1px solid var(--border);
      padding: 0.6rem 0.8rem;
      outline: none;
      transition: border-color 0.2s;
      resize: vertical;
      color: var(--text);
      border-radius: 0;
    }
    .form-group input[type="text"]:focus,
    .form-group textarea:focus { border-color: var(--gold); }
    .form-group textarea { min-height: 130px; }
    textarea.rtl-input { direction: rtl; text-align: right; }

    .char-count {
      font-size: 0.78rem;
      text-align: right;
      margin-top: 0.25rem;
      color: var(--text-light);
    }
    .char-count.warn { color: #c0392b; }

    @media (max-width: 768px) {
      .reviews-grid { grid-template-columns: 1fr; }
    }
  </style>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-H5ZXBGVT4Q"></script>
  <script>
	window.dataLayer = window.dataLayer || [];
	function gtag(){dataLayer.push(arguments);}
	gtag('js', new Date());
	gtag('config', 'G-H5ZXBGVT4Q');
  </script>
</head>
<body>
<script src="/components/header.js"></script>

<main>
  <section>
    <div class="container">

      <div class="reviews-hero">
        <h1 class="section-title">ביקורות אורחים</h1>
        <div class="section-rule"></div>
        <div class="google-badge">
          <div class="google-badge-logo">
            <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
          </div>
          <div class="google-badge-divider"></div>
          <div>
            <div class="google-badge-score">4.8</div>
            <div class="google-badge-stars">★★★★★</div>
            <div class="google-badge-count">123 ביקורות</div>
          </div>
        </div>
      </div>

      <div class="reviews-grid" id="reviews-grid"></div>

      <div class="show-more-wrap" id="show-more-wrap" style="display:none">
        <button class="btn btn-outline" id="show-more-btn">ביקורות נוספות</button>
      </div>

      <hr class="reviews-divider" />

      <h2 class="section-title" style="font-size:1.4rem;">שתפו את חוויתכם</h2>
      <p class="form-intro">שהיתם אצלנו? נשמח לשמוע מכם. הביקורת תופיע לאחר אישור קצר.</p>

      <div style="max-width:560px;margin:0 auto;">
        <form id="review-form" novalidate>
          <div class="form-group">
            <label for="reviewer-name">שמכם <span style="font-weight:300;text-transform:none;letter-spacing:0">(רשות)</span></label>
            <input type="text" id="reviewer-name" name="reviewer" placeholder="למשל: שרה, או השאירו ריק לפרסום אנונימי" maxlength="100" autocomplete="name" />
          </div>
          <div class="form-group">
            <label for="review-text">הביקורת שלכם</label>
            <textarea id="review-text" name="text" placeholder="ספרו לנו על שהותכם…" maxlength="3000" required></textarea>
            <p class="char-count" id="char-count">0 / 3000</p>
          </div>
          <div style="display:none" aria-hidden="true">
            <input type="text" name="website" tabindex="-1" autocomplete="off" />
          </div>
          <button type="submit" id="submit-btn" class="btn btn-gold" style="width:100%">שלח ביקורת</button>
          <div class="form-msg" id="form-msg" style="display:none"></div>
        </form>
      </div>

    </div>
  </section>
</main>

<script src="/components/footer.js"></script>

<script>
const REVIEWS_API = 'https://script.google.com/macros/s/AKfycbwsmf5HBXhZ6qgCCnjk0q_kvU-__XjI0A8k44Lkh_zg1jI2cTrPbYDDrJQsXYxZPOBYew/exec';

const GOOGLE_REVIEWS = [
  {
    name: "Gershon Weissman",
    date: "5 weeks ago",
    stars: 5,
    lang: "en",
    text: "We come each month for one to three nights to visit grandchildren and great grandchildren. We are so grateful to make this lovely bed and breakfast our home away from home! Shlomo and Leah are the wonderful owner/hosts and keep this beautiful historic Inn in tip top shape. The rooms are large and well appointed. The gardens are lovely with fruit trees and flowers and beautiful landscaping. Breakfasts are delicious and abundant. The dining room/library is beautiful with an attached patio with an expansive view of Mount Meron and the Old City. Our children grandchildren and great grandchildren love visiting us here and sometimes staying with us too!! The lobby has coffee/tea, cold water, snacks and fresh fruit available all the time. Comfortable lobby chairs: a place to sit before and after outdoor activities. There are many steps but even at our advanced age in the 70's, we can manage them. The stay at the hotel is worth the steps! The hosts are very flexible with our specific needs. We look forward each month to our visit and sightseeing in the area!"
  },
  {
    name: "Yahel Attaiech",
    date: "4 weeks ago",
    stars: 5,
    lang: "he",
    text: "אצל לאה ושלמה זה להיות בחופשת חמישה כוכבים ולהרגיש בבית. האירוח חם ואדיב, המקום יפהפה, עצי הלימון במרפסת הקטנה הפרטית נותנים הרגשה שאתה בפרובנס, המבנה ציורי וצפתי ורמת האירוח גבוהה. אנחנו שם כבר פעם שניה וזאת בטוח לא תהיה פעם אחרונה!"
  },
  {
    name: "Avital Yaaran",
    date: "42 weeks ago",
    stars: 5,
    lang: "he",
    text: "בילינו 3 ימים קסומים בארטיסט קולוני אין. המקום מקסים, סוויטות גדולות, מפנקות ומצוחצחות. ניכר על לאה ושלמה שהם אוהבים לארח ותמיד זמינים לכל בקשה. ארוחת הבוקר נדיבה וטעימה ויש גם פירות ופינוקים לאורך היום. מומלץ בחום!"
  },
  {
    name: "Kerri Waite",
    date: "15 weeks ago",
    stars: 5,
    lang: "en",
    text: "Leah and Schlomo were amazing hosts. This magical inn is perfectly tucked into this ancient city center yet has all the comforts of a luxury boutique hotel. We will definitely be back."
  },
  {
    name: "Oshi Nelson",
    date: "36 weeks ago",
    stars: 5,
    lang: "en",
    text: "⭐️⭐️⭐️⭐️⭐️ A truly special stay in the heart of Safed. The inn is beautifully appointed, the hosts are warm and attentive, and the atmosphere is unlike anywhere else. Highly recommend."
  },
  {
    name: "eyal menahem",
    date: "2 Jun 2025",
    stars: 5,
    lang: "he",
    text: "לכל מי שרוצה לחוות את אווירת צפת הקסומה ולהינות משקט, נוף עוצר נשימה ואויר צלול - Artist Colony Inn זה המקום בשבילכם. מקום מיוחד במינו שמשלב את הקסם של העיר העתיקה עם נוחות ואירוח חם ומפנק."
  },
  {
    name: "Daniel Zehavi",
    date: "23 May 2025",
    stars: 5,
    lang: "en",
    text: "Leah and Shlomo have done a wonderful job carrying on the legacy of Susan and the Katz family before her. The inn retains all its charm and character while offering a warm and personal welcome. A wonderful place to stay in Tzfat."
  },
  {
    name: "tamar Miller",
    date: "18 weeks ago",
    stars: 5,
    lang: "en",
    text: "This inn is great. The rooms are fabulous. The location is amazing. The service was above and beyond. Cannot recommend enough! Go!!!! You will not be sorry 😊"
  },
  {
    name: "Amihay Schwarz",
    date: "24 weeks ago",
    stars: 5,
    lang: "he",
    text: "היה נהדר, נקי ונעים מאוד. אוירה משפחתית. ארוחות שבת משותפות עם האורחים האחרים היו חוויה מיוחדת."
  },
  {
    name: "Batya Lengler",
    date: "5 Sept 2023",
    stars: 5,
    lang: "en",
    text: "Beautiful place, beautiful rooms, beautiful views, and beautiful people! Very clean and organized. Highly recommended."
  },
  {
    name: "Dan Chemla",
    date: "28 Aug 2023",
    stars: 5,
    lang: "en",
    text: "Thanks Shlomo, it was perfect. Beautiful place in a wonderful location."
  }
];

const PAGE_SIZE = 6;
let shown = 0;

function buildCard(r) {
  const isHe = r.lang === 'he';
  const stars = '★'.repeat(r.stars);
  const card = document.createElement('div');
  card.className = 'review-card';

  const textId = 'rt-' + Math.random().toString(36).substr(2, 6);
  const btnId  = 'rb-' + Math.random().toString(36).substr(2, 6);

  card.innerHTML = `
    <div class="review-meta">
      <span class="review-name">${escHtml(r.name)}</span>
      <span class="review-date">${escHtml(r.date)}</span>
    </div>
    <div class="review-stars">${stars}</div>
    <p class="review-text${isHe ? ' rtl' : ''} collapsed" id="${textId}">${escHtml(r.text)}</p>
    <button class="review-read-more" id="${btnId}">קרא עוד ›</button>
  `;

  // show read-more only if text is clamped
  setTimeout(() => {
    const el = document.getElementById(textId);
    const btn = document.getElementById(btnId);
    if (el && el.scrollHeight > el.clientHeight + 4) {
      btn.style.display = 'block';
      btn.addEventListener('click', () => {
        el.classList.remove('collapsed');
        btn.style.display = 'none';
      });
    }
  }, 50);

  return card;
}

function showMore() {
  const grid = document.getElementById('reviews-grid');
  const batch = GOOGLE_REVIEWS.slice(shown, shown + PAGE_SIZE);
  batch.forEach(r => grid.appendChild(buildCard(r)));
  shown += batch.length;

  const wrap = document.getElementById('show-more-wrap');
  if (shown < GOOGLE_REVIEWS.length) {
    wrap.style.display = 'block';
  } else {
    wrap.style.display = 'none';
  }
}

document.getElementById('show-more-btn').addEventListener('click', showMore);
showMore();

// ── submission form ──────────────────────────────────────────
const textarea  = document.getElementById('review-text');
const charCount = document.getElementById('char-count');
const MAX = 3000;

textarea.addEventListener('input', () => {
  const len = textarea.value.length;
  charCount.textContent = len + ' / ' + MAX;
  charCount.classList.toggle('warn', len > MAX * 0.9);
  const sample = textarea.value.replace(/\s/g, '').substring(0, 20);
  const heRatio = (sample.match(/[\u0590-\u05FF]/g) || []).length / (sample.length || 1);
  textarea.classList.toggle('rtl-input', heRatio > 0.3);
});

const form      = document.getElementById('review-form');
const submitBtn = document.getElementById('submit-btn');
const formMsg   = document.getElementById('form-msg');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (form.elements['website'].value) return;

  const text     = textarea.value.trim();
  const reviewer = document.getElementById('reviewer-name').value.trim();

  if (!text) {
    showMsg('נא לכתוב את ביקורתכם לפני השליחה.', 'error');
    textarea.focus();
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'שולח…';
  hideMsg();

  try {
    const params = new URLSearchParams({ action: 'submit', reviewer, text });
    const res  = await fetch(REVIEWS_API + '?' + params.toString());
    const data = await res.json();
    if (data.ok) {
      showMsg('תודה! ביקורתכם התקבלה ותופיע בקרוב לאחר אישור.', 'success');
      form.reset();
      textarea.classList.remove('rtl-input');
      charCount.textContent = '0 / ' + MAX;
      charCount.classList.remove('warn');
    } else {
      showMsg('משהו השתבש: ' + (data.error || 'נסו שוב.'), 'error');
    }
  } catch(err) {
    showMsg('לא ניתן לשלוח כרגע. נסו שוב מאוחר יותר.', 'error');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'שלח ביקורת';
  }
});

function showMsg(text, type) {
  formMsg.textContent = text;
  formMsg.className   = 'form-msg ' + type;
  formMsg.style.display = 'block';
}
function hideMsg() {
  formMsg.style.display = 'none';
  formMsg.textContent = '';
}
function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
