<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guest Reviews | Artists' Colony Inn</title>
  <meta name="description" content="Read what guests say about their stay at the Artists' Colony Inn in Tzfat, Israel.">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .review-card {
      background: var(--bg-parchment, #faf7f2);
      border: 1px solid var(--border, #e0d5c0);
      border-left: 3px solid var(--gold, #b8976a);
      border-radius: 4px;
      padding: 1.4rem 1.6rem;
      margin-bottom: 1.25rem;
      transition: box-shadow 0.2s;
    }
    .review-card:hover { box-shadow: 0 2px 12px rgba(184,151,106,0.12); }

    .review-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.25rem;
      margin-bottom: 0.75rem;
    }
    .review-name {
      font-weight: 600;
      font-size: 1rem;
    }
    .review-date {
      font-size: 0.85rem;
      opacity: 0.65;
      font-style: italic;
    }
    .review-text {
      font-size: 1rem;
      opacity: 0.8;
      white-space: pre-wrap;
      line-height: 1.7;
    }
    .review-text.rtl {
      direction: rtl;
      text-align: right;
    }

    .state-msg {
      text-align: center;
      padding: 2.5rem 1rem;
      opacity: 0.6;
      font-style: italic;
    }

    .reviews-divider {
      border: none;
      border-top: 1px solid var(--border, #e0d5c0);
      margin: 3rem 0;
    }

    .form-intro {
      font-size: 1rem;
      opacity: 0.75;
      margin-bottom: 1.5rem;
      font-style: italic;
    }

    .form-group { margin-bottom: 1.25rem; }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
      opacity: 0.8;
    }
    .form-group label .optional {
      font-weight: 300;
      text-transform: none;
      letter-spacing: 0;
      font-size: 0.85rem;
    }

    .form-group input[type="text"],
    .form-group textarea {
      width: 100%;
      font-family: inherit;
      font-size: 1rem;
      background: var(--bg-parchment, #faf7f2);
      border: 1px solid var(--border, #e0d5c0);
      border-radius: 4px;
      padding: 0.65rem 0.85rem;
      outline: none;
      transition: border-color 0.2s;
      resize: vertical;
      color: inherit;
    }
    .form-group input[type="text"]:focus,
    .form-group textarea:focus { border-color: var(--gold, #b8976a); }
    .form-group textarea { min-height: 130px; }

    textarea.rtl-input { direction: rtl; text-align: right; }

    .char-count {
      font-size: 0.8rem;
      text-align: right;
      margin-top: 0.25rem;
      opacity: 0.5;
    }
    .char-count.warn { color: #c0392b; opacity: 1; }

    .form-msg {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 4px;
      font-size: 0.95rem;
      display: none;
    }
    .form-msg.success {
      background: #f0f7ec;
      border: 1px solid #8aaf72;
      color: #3a6b20;
      display: block;
    }
    .form-msg.error {
      background: #fdf0f0;
      border: 1px solid #d9928f;
      color: #8b2020;
      display: block;
    }

    @media (max-width: 480px) {
      .review-card { padding: 1rem 1.1rem; }
    }
  </style>
</head>
<body>
<script src="/components/header.js"></script>

<main>
  <section>
    <div class="container">
      <h1 class="section-title">Guest Reviews</h1>
      <div class="section-rule"></div>

      <!-- Reviews list -->
      <div id="reviews-list">
        <p class="state-msg" id="loading-msg">Loading reviews…</p>
      </div>

      <hr class="reviews-divider" />

      <!-- Submit form -->
      <h2 class="section-title" style="font-size:1.1rem;">Share Your Experience</h2>
      <p class="form-intro">Stayed with us? We'd love to hear from you. Your review will appear after a brief moderation step.</p>

      <form id="review-form" novalidate>

        <div class="form-group">
          <label for="reviewer-name">Your name <span class="optional">(optional)</span></label>
          <input type="text" id="reviewer-name" name="reviewer" placeholder="e.g. Sarah, or leave blank to post anonymously" maxlength="100" autocomplete="name" />
        </div>

        <div class="form-group">
          <label for="review-text">Your review</label>
          <textarea id="review-text" name="text" placeholder="Tell us about your stay…" maxlength="3000" required></textarea>
          <p class="char-count" id="char-count">0 / 3000</p>
        </div>

        <!-- honeypot -->
        <div style="display:none" aria-hidden="true">
          <input type="text" name="website" tabindex="-1" autocomplete="off" />
        </div>

        <button type="submit" id="submit-btn" class="btn-primary">Submit Review</button>
        <div class="form-msg" id="form-msg"></div>

      </form>

    </div>
  </section>
</main>

<script src="/components/footer.js"></script>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbwsmf5HBXhZ6qgCCnjk0q_kvU-__XjI0A8k44Lkh_zg1jI2cTrPbYDDrJQsXYxZPOBYew/exec';

const PAGE_SIZE = 10;
  let allReviews = [];
  let shown = 0;

  async function loadReviews() {
    const list    = document.getElementById('reviews-list');
    const loading = document.getElementById('loading-msg');
    try {
      const res  = await fetch(API_URL);
      const data = await res.json();
      loading.remove();
      if (!data.ok || !data.reviews.length) {
        list.innerHTML = '<p class="state-msg">No reviews yet. Be the first!</p>';
        return;
      }
      allReviews = data.reviews;
      showMore();
    } catch(e) {
      loading.textContent = 'Unable to load reviews at this time.';
    }
  }

  function showMore() {
    const list = document.getElementById('reviews-list');
    const batch = allReviews.slice(shown, shown + PAGE_SIZE);
    batch.forEach(r => list.appendChild(buildCard(r)));
    shown += batch.length;

    const existing = document.getElementById('show-more-btn');
    if (existing) existing.remove();

    if (shown < allReviews.length) {
      const btn = document.createElement('button');
      btn.id = 'show-more-btn';
      btn.className = 'btn-primary';
      btn.style.cssText = 'display:block;margin:1.5rem auto 0;';
      btn.textContent = 'Show more reviews';
      btn.addEventListener('click', showMore);
      list.appendChild(btn);
    }
  }

  function buildCard(r) {
    const isHebrew = r.language === 'Hebrew';
    const name = (r.reviewer || 'Guest')
      .replace(/\s*\(אורח\)\s*/g, '')
      .replace(/\s*\/\s*אורח\s*/g, '')
      .trim() || 'Guest';

    const card = document.createElement('div');
    card.className = 'review-card';
    card.innerHTML = `
      <div class="review-meta">
        <span class="review-name">${escHtml(name)}</span>
        <span class="review-date">${escHtml(r.date)}</span>
      </div>
      <p class="review-text${isHebrew ? ' rtl' : ''}">${escHtml(r.text)}</p>
    `;
    return card;
  }

  const textarea  = document.getElementById('review-text');
  const charCount = document.getElementById('char-count');
  const MAX = 3000;

  textarea.addEventListener('input', () => {
    const len = textarea.value.length;
    charCount.textContent = len + ' / ' + MAX;
    charCount.classList.toggle('warn', len > MAX * 0.9);
    const sample = textarea.value.replace(/\s/g, '').substring(0, 20);
    const hebrewRatio = (sample.match(/[\u0590-\u05FF]/g) || []).length / (sample.length || 1);
    textarea.classList.toggle('rtl-input', hebrewRatio > 0.3);
  });

  const form      = document.getElementById('review-form');
  const submitBtn = document.getElementById('submit-btn');
  const formMsg   = document.getElementById('form-msg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (form.elements['website'].value) return;

    const text     = textarea.value.trim();
    const reviewer = document.getElementById('reviewer-name').value.trim();

    if (!text) {
      showMsg('Please write your review before submitting.', 'error');
      textarea.focus();
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting…';
    hideMsg();

    try {
      const params = new URLSearchParams({ action: 'submit', reviewer, text });
      const res  = await fetch(API_URL + '?' + params.toString());
      const data = await res.json();
      if (data.ok) {
        showMsg('Thank you! Your review has been received and will appear shortly after moderation.', 'success');
        form.reset();
        textarea.classList.remove('rtl-input');
        charCount.textContent = '0 / ' + MAX;
        charCount.classList.remove('warn');
      } else {
        showMsg('Something went wrong: ' + (data.error || 'please try again.'), 'error');
      }
    } catch(err) {
      showMsg('Unable to submit at this time. Please try again later.', 'error');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit Review';
    }
  });

  function showMsg(text, type) {
    formMsg.textContent = text;
    formMsg.className   = 'form-msg ' + type;
  }
  function hideMsg() {
    formMsg.className = 'form-msg';
    formMsg.textContent = '';
  }

  function escHtml(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  loadReviews();
</script>
</body>
</html>
