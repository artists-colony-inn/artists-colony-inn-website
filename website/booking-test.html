			  <div class="form-row" id="meals-field" style="display:none">
                <div class="form-field"><label>ארוחות שבת (₪100 לארוחה,לא כולל מע"מ)</label><input type="number" id="meals" min="0" max="20" value="0"></div>
              </div>
            </div>
            <div class="form-row">
              <div class="form-field"><label>לאום</label><input type="text" id="nationality" placeholder="למשל: ישראלי, אמריקאי, צרפתי"></div>
              <div class="form-field">
                <label>אזרח או תושב ישראל? <span class="req">*</span></label>
                <div style="display:flex;gap:1rem;margin-top:0.4rem">
                  <label style="display:flex;align-items:center;gap:0.4rem;font-family:var(--sans);font-size:0.92rem;text-transform:none;letter-spacing:0;color:var(--text-mid);cursor:pointer;font-weight:400">

                  <label style="display:flex;align-items:center;gap:0.4rem;font-family:var(--sans);font-size:0.92rem;text-transform:none;letter-spacing:0;color:var(--text-mid);cursor:pointer;font-weight:400">

              </div>

            <div id="vat-exempt-note" style="display:none;background:#fff8e1;border:1px solid #f9a825;border-radius:4px;padding:0.75rem 1rem;font-family:var(--sans);font-size:0.82rem;color:#7a5c00;line-height:1.6;margin-bottom:1.25rem;direction:rtl;text-align:right">

<script>
const BOOKING_API   = 'https://script.google.com/macros/s/AKfycbw9wuatkTr1_ajEtjYD5i9M3QiSHxC6E2jMSxrVJf1BXync1BkRC8LbdeueFs7h5zhS/exec';
const AVAIL_API_URL = 'https://script.google.com/macros/s/AKfycbx0HmXiBpQtJPm4CUuxVrmIWXKJCmA7zzJkq2tWCPvP2n439v5MobUPEQxorBDb4XR1Xw/exec';
const REVIEWS_API   = 'https://script.google.com/macros/s/AKfycbzVmDCp9ajvCPVQEhxV1RMDpWgJBbAzuCfdGfQ0UotgW9GNYJBpVbncPl6C-dCuMNB6/exec';

let priceCache = {};

function updateSubmitBtn() {
  var btn     = document.getElementById('submit-btn');
  var agreed  = document.getElementById('agree-policies').checked;
  var nameOk  = document.getElementById('name').value.trim().length > 0;
  var phoneOk = document.getElementById('phone').value.trim().length > 0;
  var enabled = agreed && nameOk && phoneOk;
  btn.disabled      = !enabled;
  btn.style.opacity = enabled ? '1' : '0.45';
  btn.style.cursor  = enabled ? 'pointer' : 'not-allowed';
}

window.addEventListener('DOMContentLoaded', function() {
  var p = new URLSearchParams(window.location.search);
  var checkin  = p.get('checkin');
  var checkout = p.get('checkout');

  var bookingRooms = [];
  var isMultiRoom = !!p.get('prices');

  if (isMultiRoom) {
    var roomsArr  = p.get('rooms').split(',');
    var guestsArr = (p.get('guests') || '').split(',');
    var pricesArr = (p.get('prices') || '').split(',');
    roomsArr.forEach(function(r, i) {
      bookingRooms.push({
        room:   decodeURIComponent(r),
        guests: parseInt(guestsArr[i]) || 0,
        price:  parseInt(pricesArr[i]) || 0
      });
    });
  } else {
    var room   = p.get('room');
    var guests = p.get('guests');
    if (room) bookingRooms.push({ room: room, guests: parseInt(guests) || 0, price: null });
  }

  if (!bookingRooms.length || !checkin || !checkout) {
    window.location.replace('/index.html');
    return;
  }
  window.bookingRooms = bookingRooms;
  window.isMultiRoom = isMultiRoom;

  var first = bookingRooms[0];
  var room = first.room, guests = String(first.guests);

  document.getElementById('room').value     = room;
  document.getElementById('checkin').value  = checkin;
  document.getElementById('checkout').value = checkout;
  document.getElementById('guests').value   = guests;

  var guestLabels = { '1': 'אורח 1', '2': '2 אורחים', '3': '3 אורחים', '4': '4 אורחים' };
  var roomLabels  = { 'Tzviya': 'צביה', 'Aryeh': 'אריה', 'Liana': 'ליאנה', 'Avital': 'אביטל', 'Orly': 'אורלי' };
  window.roomLabels = roomLabels;
  var guestLabel = function(g) { return guestLabels[String(g)] || g + ' אורחים'; };
  var fmtDate = function(iso) {
    var d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('he-IL', { day:'numeric', month:'numeric', year:'numeric' });
  };
  document.getElementById('room-display').value     = roomLabels[room] || room;
  document.getElementById('guests-display').value   = guestLabel(first.guests);
  document.getElementById('checkin-display').value  = fmtDate(checkin);
  document.getElementById('checkout-display').value = fmtDate(checkout);

  var extraRows = document.getElementById('extra-rooms-rows');
  for (var i = 1; i < bookingRooms.length; i++) {
    (function(r) {
      var row = document.createElement('div');
      row.className = 'form-row';
      var roomField = document.createElement('div');
      roomField.className = 'form-field';
      roomField.innerHTML = '<label>חדר</label><input type="text" readonly value="' + (roomLabels[r.room] || r.room) + '" style="background:var(--bg-stone);color:var(--text-light);cursor:default">';
      var guestsField = document.createElement('div');
      guestsField.className = 'form-field';
      guestsField.innerHTML = '<label>אורחים</label><input type="text" readonly value="' + guestLabel(r.guests) + '" style="background:var(--bg-stone);color:var(--text-light);cursor:default">';
      row.appendChild(roomField);
      row.appendChild(guestsField);
      extraRows.appendChild(row);
    })(bookingRooms[i]);
  }

  updateMealsVisibility(checkin, checkout);
  updatePrice();

  document.getElementById('meals').addEventListener('input', updatePrice);

  // Citizenship toggle
  document.querySelectorAll('input[name="is_israeli"]').forEach(function(radio) {
    radio.addEventListener('change', function() {
      var isIsraeli = this.value === 'yes';
      document.getElementById('vat-exempt-note').style.display = isIsraeli ? 'none' : '';
      updatePrice();
    });
  });

  // Submit button state watchers
  document.getElementById('agree-policies').addEventListener('change', updateSubmitBtn);
  ['name','phone'].forEach(function(id) {
    document.getElementById(id).addEventListener('input', updateSubmitBtn);
  });

  updateSubmitBtn();

  // Load reviews sidebar
  fetch(REVIEWS_API)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var list = document.getElementById('reviews-list-sidebar');
      if (!list) return;
      if (!data.ok || !data.reviews || !data.reviews.length) { list.innerHTML = ''; return; }
      list.innerHTML = '';
      data.reviews.slice(0, 5).forEach(function(r) {
        var card = document.createElement('div');
        card.style.cssText = 'border-right:2px solid var(--gold);padding:0.75rem 0.85rem 0.75rem 0;margin-bottom:1.1rem;';
        var name = document.createElement('div');
        name.style.cssText = 'font-family:var(--sans);font-size:0.78rem;font-weight:500;color:var(--text);margin-bottom:0.2rem;';
        name.textContent = r.name;
        var stars = document.createElement('div');
        stars.style.cssText = 'color:#FBBC05;font-size:0.7rem;margin-bottom:0.35rem;';
        stars.textContent = '★★★★★';
        var text = document.createElement('p');
        text.style.cssText = 'font-family:var(--sans);font-size:0.78rem;color:var(--text-light);line-height:1.6;margin:0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;';
        text.textContent = r.text;
        card.appendChild(name);
        card.appendChild(stars);
        card.appendChild(text);
        list.appendChild(card);
      });
    })
    .catch(function() {
      var list = document.getElementById('reviews-list-sidebar');
      if (list) list.innerHTML = '';
    });
});

function updateMealsVisibility(checkin, checkout) {
  var field = document.getElementById('meals-field');
  var start = new Date(checkin + 'T00:00:00');
  var end   = new Date(checkout + 'T00:00:00');
  var hasFriday = false;
  for (var d = new Date(start); d < end; d.setDate(d.getDate() + 1)) {
    if (d.getDay() === 5) { hasFriday = true; break; }
  }
  var today = new Date();
  today.setHours(0, 0, 0, 0);
  var daysOut = Math.round((start - today) / 86400000);
  var eligible = hasFriday && daysOut >= 2;
  field.style.display = eligible ? '' : 'none';
  if (!eligible) document.getElementById('meals').value = 0;
}

async function updatePrice() {
  if (window.isMultiRoom) return updatePriceMultiRoom();
  const room     = document.getElementById('room').value;
  const checkin  = document.getElementById('checkin').value;
  const checkout = document.getElementById('checkout').value;
  const guests   = parseInt(document.getElementById('guests').value) || 2;
  const box      = document.getElementById('price-box');

  if (!room || !checkin || !checkout || checkin >= checkout) {
    box.style.display = 'none';
    return;
  }

  let data;
  try {
    if (priceCache[room]) {
      data = priceCache[room];
    } else {
      const res = await fetch(AVAIL_API_URL + '?room=' + encodeURIComponent(room));
      data = await res.json();
      priceCache[room] = data;
    }
  } catch(e) {
    box.style.display = 'none';
    return;
  }

  if (!data.dates) { box.style.display = 'none'; return; }

  const lookup = {};
  data.dates.forEach(function(d) { if (d.price) lookup[d.date] = d.price; });

  let base = 0;
  const start = new Date(checkin);
  const end   = new Date(checkout);
  for (var d = new Date(start); d < end; d.setDate(d.getDate() + 1)) {
    const iso = d.getFullYear() + '-' +
      String(d.getMonth()+1).padStart(2,'0') + '-' +
      String(d.getDate()).padStart(2,'0');
    if (lookup[iso]) base += lookup[iso];
  }

  if (!base) { box.style.display = 'none'; return; }

  const nights = Math.round((end - start) / 86400000);
  let surchargeRate = 0;
  if (guests === 3) surchargeRate = 0.25;
  if (guests >= 4)  surchargeRate = 0.50;
  const surcharge  = Math.round(base * surchargeRate);
  const mealsCount = parseInt(document.getElementById('meals').value) || 0;
  const mealsBase  = mealsCount * 100;
  const beforeVAT  = base + surcharge + mealsBase;
  const isIsraeli  = document.querySelector('input[name="is_israeli"]:checked').value === 'yes';
  const vat        = isIsraeli ? Math.round(beforeVAT * 0.18) : 0;
  const total      = beforeVAT + vat;

  const fmt = function(n) {
    return '₪' + n.toLocaleString('he-IL', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  };

  document.getElementById('price-rooms-rows').innerHTML       = '';
  document.getElementById('price-base-row').style.display     = '';
  document.getElementById('price-base-row').textContent        = nights + ' לילות (מחיר בסיס): ' + fmt(base);
  document.getElementById('price-surcharge-row').style.display = surcharge ? '' : 'none';
  document.getElementById('price-surcharge-row').textContent   = 'תוספת אורחים (' + (surchargeRate * 100) + '%): ' + fmt(surcharge);
  document.getElementById('price-meals-row').style.display     = mealsBase ? '' : 'none';
  document.getElementById('price-meals-row').textContent       = 'ארוחות שבת (' + mealsCount + '): ' + fmt(mealsBase);
  document.getElementById('price-vat-row').style.display       = 'none';
  document.getElementById('price-total-row').textContent       = 'סה"כ לתשלום' + (isIsraeli ? ' (כולל מע"מ)' : '') + ': ' + fmt(total);
  box.style.display = 'block';

  var cancelNote = document.getElementById('cancel-policy-note');
  if (cancelNote) cancelNote.style.display = 'block';
}

function updatePriceMultiRoom() {
  const checkin  = document.getElementById('checkin').value;
  const checkout = document.getElementById('checkout').value;
  const box        = document.getElementById('price-box');
  const bookingRooms = window.bookingRooms;
  const roomLabels = window.roomLabels || {};

  if (!checkin || !checkout || checkin >= checkout || !bookingRooms.length) {
    box.style.display = 'none';
    return;
  }

  const fmt = function(n) {
    return '₪' + n.toLocaleString('he-IL', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  };

  const roomsInclusive = bookingRooms.reduce(function(sum, r) { return sum + r.price; }, 0);
  const roomsBeforeVAT = Math.round(roomsInclusive / 1.18);

  const mealsCount = parseInt(document.getElementById('meals').value) || 0;
  const mealsBase  = mealsCount * 100;
  const beforeVAT  = roomsBeforeVAT + mealsBase;
  const isIsraeli  = document.querySelector('input[name="is_israeli"]:checked').value === 'yes';
  const vat        = isIsraeli ? Math.round(beforeVAT * 0.18) : 0;
  const total       = beforeVAT + vat;

  var roomsRowsEl = document.getElementById('price-rooms-rows');
  roomsRowsEl.innerHTML = '';
  bookingRooms.forEach(function(r) {
    var line = document.createElement('div');
    var guestsTxt = (r.guests === 1 ? 'אורח 1' : r.guests + ' אורחים');
    line.textContent = (roomLabels[r.room] || r.room) + ' (' + guestsTxt + '): ' + fmt(r.price);
    roomsRowsEl.appendChild(line);
  });

  document.getElementById('price-base-row').style.display      = 'none';
  document.getElementById('price-surcharge-row').style.display = 'none';
  document.getElementById('price-meals-row').style.display     = mealsBase ? '' : 'none';
  document.getElementById('price-meals-row').textContent       = 'ארוחות שבת (' + mealsCount + '): ' + fmt(mealsBase);
  document.getElementById('price-vat-row').style.display       = 'none';
  document.getElementById('price-total-row').textContent       = 'סה"כ לתשלום' + (isIsraeli ? ' (כולל מע"מ)' : '') + ': ' + fmt(total);
  box.style.display = 'block';

  var cancelNote = document.getElementById('cancel-policy-note');
  if (cancelNote) cancelNote.style.display = 'block';
}

async function checkAvailability(room, checkin, checkout) {
  const res = await fetch(AVAIL_API_URL + '?room=' + encodeURIComponent(room));
  const data = await res.json();
  if (!data.dates) return false;
  const blocked = new Set(data.dates.filter(function(d) { return d.blocked; }).map(function(d) { return d.date; }));
  const start = new Date(checkin);
  const end   = new Date(checkout);
  for (var d = new Date(start); d < end; d.setDate(d.getDate() + 1)) {
    const iso = d.getFullYear() + '-' +
      String(d.getMonth()+1).padStart(2,'0') + '-' +
      String(d.getDate()).padStart(2,'0');
    if (blocked.has(iso)) return false;
  }
  return true;
}

async function submitBooking() {
  var checkin   = document.getElementById('checkin').value,
      checkout  = document.getElementById('checkout').value,
      name      = document.getElementById('name').value.trim(),
      email     = document.getElementById('email').value.trim(),
      phone     = document.getElementById('phone').value.trim();

  var bookingRooms = window.isMultiRoom ? window.bookingRooms : [{
    room: document.getElementById('room').value.trim(),
    guests: parseInt(document.getElementById('guests').value) || 0
  }];

  var isIsraeli = document.querySelector('input[name="is_israeli"]:checked').value === 'yes';

  if (!bookingRooms.length || bookingRooms.some(function(r){return !r.room;}) || !checkin||!checkout||!name||!phone) { alert('נא למלא את כל השדות הנדרשים.'); return; }
  var cleanPhone = phone.replace(/[\s\-\(\)\.]/g, '');
  if (!/^\+?[0-9]{7,15}$/.test(cleanPhone)) { alert('נא להזין מספר טלפון תקין.'); return; }
  if (!document.getElementById('agree-policies').checked) { alert('נא לקרוא ולאשר את התקנון לפני השליחה.'); return; }

  var btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.style.opacity = '0.45';
  btn.textContent = bookingRooms.length > 1 ? 'בודק זמינות לכל החדרים...' : 'בודק זמינות...';

  var unavailableRooms = [];
  try {
    for (var i = 0; i < bookingRooms.length; i++) {
      var ok = await checkAvailability(bookingRooms[i].room, checkin, checkout);
      if (!ok) unavailableRooms.push(bookingRooms[i].room);
    }
  } catch(e) {
    btn.disabled = false;
    btn.style.opacity = '1';
    btn.textContent = 'המשך לתשלום';
    alert('לא ניתן לאמת זמינות. נסו שוב או צרו קשר ישירות.');
    return;
  }
  if (unavailableRooms.length) {
    btn.disabled = false;
    btn.style.opacity = '1';
    btn.textContent = 'המשך לתשלום';
    var roomLabels = window.roomLabels || {};
    if (bookingRooms.length === 1) {
      alert('מצטערים, אחד או יותר מהתאריכים שנבחרו אינם זמינים עבור ' + unavailableRooms[0] + '. אנא בחרו תאריכים אחרים.');
    } else {
      var names = unavailableRooms.map(function(r){ return roomLabels[r] || r; });
      alert('מצטערים, החדרים הבאים אינם זמינים יותר לתאריכים אלו: ' + names.join(', ') + '. אנא בחרו תאריכים או חדרים אחרים.');
    }
    return;
  }

  btn.textContent = 'מעביר לתשלום...';

  var params = new URLSearchParams(window.location.search);
  params.set('name', name);
  params.set('email', email);
  params.set('phone', phone);
  params.set('meals', document.getElementById('meals').value);
  params.set('nationality', document.getElementById('nationality').value.trim());
  params.set('is_israeli', isIsraeli ? 'yes' : 'no');
  params.set('requests', document.getElementById('requests').value.trim());
  params.set('website', document.getElementById('website').value);

  window.location.replace('/payment.html?' + params.toString());
}
</script>
</body>
</html>
