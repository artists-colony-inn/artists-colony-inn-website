<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Artists' Colony Inn</title>
  <meta name="description" content="Photos of the Artists' Colony Inn in Tzfat — suites, gardens, views over the Galilee.">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* ── GALLERY GRID ── */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      margin-top: 2.5rem;
    }

    .gallery-item {
      overflow: hidden;
      cursor: pointer;
      aspect-ratio: 4/3;
      background: var(--bg-stone);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.04);
    }

    /* ── LIGHTBOX ── */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(26, 22, 16, 0.94);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox-img-wrap {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-img-wrap img {
      max-width: 90vw;
      max-height: 88vh;
      object-fit: contain;
      display: block;
      box-shadow: 0 8px 60px rgba(0,0,0,0.6);
    }

    .lightbox-close {
      position: fixed;
      top: 1.25rem;
      right: 1.5rem;
      background: none;
      border: none;
      color: rgba(255,255,255,0.7);
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
      padding: 0.25rem 0.5rem;
      transition: color 0.2s;
      font-family: var(--sans);
      font-weight: 300;
    }

    .lightbox-close:hover { color: #fff; }

    .lightbox-prev,
    .lightbox-next {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: 1px solid rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.7);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0.75rem 1rem;
      transition: all 0.2s;
      font-family: var(--sans);
    }

    .lightbox-prev { left: 1.25rem; }
    .lightbox-next { right: 1.25rem; }

    .lightbox-prev:hover,
    .lightbox-next:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border-color: rgba(255,255,255,0.5);
    }

    .lightbox-counter {
      position: fixed;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--sans);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.45);
    }

    @media (max-width: 900px) {
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 480px) {
      .gallery-grid { grid-template-columns: 1fr; gap: 0.5rem; }
      .lightbox-prev { left: 0.5rem; }
      .lightbox-next { right: 0.5rem; }
    }
  </style>
</head>
<body>
<script src="/components/header.js"></script>

<main>
  <section>
    <div class="container">
      <h1 class="section-title">Gallery</h1>
      <div class="section-rule"></div>

      <div class="gallery-grid" id="gallery-grid">

        <!-- Views & Exterior -->
        <div class="gallery-item" data-index="0">
          <img src="/images/gallery/view-sunset.jpg" alt="Sunset view over the Galilee from the inn terrace" loading="lazy">
        </div>
        <div class="gallery-item" data-index="1">
          <img src="/images/gallery/terrace-table.jpg" alt="Terrace with mosaic table and Galilee view" loading="lazy">
        </div>
        <div class="gallery-item" data-index="2">
          <img src="/images/gallery/entrance.jpg" alt="Stone entrance to the inn" loading="lazy">
        </div>

        <!-- Add more items below as you add photos -->
        <!-- Pattern: <div class="gallery-item" data-index="N">
               <img src="/images/gallery/filename.jpg" alt="Description" loading="lazy">
             </div> -->

      </div>
    </div>
  </section>
</main>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lightbox-close" id="lb-close" aria-label="Close">&times;</button>
  <button class="lightbox-prev" id="lb-prev" aria-label="Previous">&#8592;</button>
  <div class="lightbox-img-wrap">
    <img id="lb-img" src="" alt="">
  </div>
  <button class="lightbox-next" id="lb-next" aria-label="Next">&#8594;</button>
  <div class="lightbox-counter" id="lb-counter"></div>
</div>

<script src="/components/footer.js"></script>

<script>
  (function() {
    var items = Array.from(document.querySelectorAll('.gallery-item'));
    var lightbox = document.getElementById('lightbox');
    var lbImg = document.getElementById('lb-img');
    var lbCounter = document.getElementById('lb-counter');
    var current = 0;

    function open(index) {
      current = index;
      var img = items[current].querySelector('img');
      lbImg.src = img.src;
      lbImg.alt = img.alt;
      lbCounter.textContent = (current + 1) + ' / ' + items.length;
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function close() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    }

    function prev() {
      current = (current - 1 + items.length) % items.length;
      open(current);
    }

    function next() {
      current = (current + 1) % items.length;
      open(current);
    }

    items.forEach(function(item) {
      item.addEventListener('click', function() {
        open(parseInt(item.dataset.index));
      });
    });

    document.getElementById('lb-close').addEventListener('click', close);
    document.getElementById('lb-prev').addEventListener('click', prev);
    document.getElementById('lb-next').addEventListener('click', next);

    lightbox.addEventListener('click', function(e) {
      if (e.target === lightbox) close();
    });

    document.addEventListener('keydown', function(e) {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') close();
      if (e.key === 'ArrowLeft') prev();
      if (e.key === 'ArrowRight') next();
    });
  })();
</script>

</body>
</html>
